    compare_against: ""
    comparable: false
    why_not: "mention-level on 206 GSC-2024 documents; printed so AutoPCR's published row has its
      own comparators rather than being read against ours"
    precision: 0.8590
    recall: 0.7488
    f1: 0.8001
    tp: ""

    recall: 0.42
    f1: 0.46
    tp: 428
    fp: 204
    fn: 583
    note: ""

  # ── Tao et al., AutoPCR (Bioinformatics 2026, 42(Suppl 1):btag304) ────────
  #
  # NOT transferable, for three independent reasons, and the row exists to say so rather
  # than to be quietly omitted:
  #   (1) the corpus is GSC-2024 (FastHPOCR's refinement of GSC+), 228 abstracts of which 22 are
  #       development and 206 are evaluated, not RAG-HPO's 114;
  #   (2) the ground truth is that corpus's own annotation, not RAG-HPO's re-annotation;
  #   (3) the main is MENTION-level (a hit needs a matching code AND overlapping offsets),
  #       which no method in t1_overall.csv emits.
  # Their document-level F1 exists (Table 3's dF1 column) and IS micro-averaged over documents like
  # ours, so it is the one figure of theirs defined the same way, (1) and (2) still stand.
  # Our own AutoPCR rows run the published extraction (ee="neural++") but a local LLaMA linker
  # rather than their Qwen3-Next-80B.
  - label: "AutoPCR (published, mention-level)"
    system_of: autopcr_70b

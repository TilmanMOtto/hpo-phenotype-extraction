# Exact package versions of the local conda environment the code was developed and checked in
# (Python 3.10, PyTorch 2.5.1 CPU build). The thesis runs on LeoMed used the conda environment
# exported to environment_leomed.yml (as it was on 2026-10-04: PyTorch 2.6.0, transformers 4.57.6,
# Stanza 1.10.1). Packages updated after a run are not recorded.
# Use that file to reproduce thesis numbers on a GPU machine.
# PhenoBERT and AutoPCR's parser need their own environments (third_party/README.md).
#
#   conda env create -f environment.yml && conda activate hpo-extraction && pip install -e .
